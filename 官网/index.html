<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>易可聊 - 即时通讯</title>
  <meta name="description" content="易可聊是一款即时通讯应用，支持多国手机号注册，可与好友和群组收发文字、图片、语音和文件。">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: #1480dc;
      color: #fff;
      font-family: Arial, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 72px 22px 78px;
      background-image: linear-gradient(326deg, #5ec8ff 0%, #1a86ea 34%, #0b4ea8 100%);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background: url("assets/header-bg.png") center bottom / cover no-repeat;
      opacity: 0.45;
      pointer-events: none;
    }
    .lang { position: absolute; top: 16px; right: 16px; z-index: 3; }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 0;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }
    .lang-caret {
      width: 7px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: translateY(-2px) rotate(45deg);
    }
    .lang-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 132px;
      padding: 4px 0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .lang.open .lang-menu { display: block; }
    .lang-item {
      display: block;
      width: 100%;
      padding: 8px 16px;
      border: 0;
      background: transparent;
      color: #374151;
      font: inherit;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }
    .lang-item.active { background: #dbeafe; color: #1d4ed8; }
    .hero-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 150px;
      height: 150px;
      border-radius: 36px;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.72), 0 0 42px rgba(147, 197, 253, 0.55);
    }
    .subline {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      font-size: 16px;
      line-height: 24px;
    }
    .headline {
      margin: 6px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 20px;
      font-weight: 700;
      line-height: 28px;
      text-align: center;
    }
    .pill {
      width: 100%;
      min-height: 46px;
      margin-top: 22px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #fff;
      color: #1274d6;
    }
    .pill-lite { margin-top: 16px; }
    .pill img { width: 24px; height: 24px; margin-right: 8px; }
    .pill span { font-size: 16px; font-weight: 700; line-height: 24px; }
    .passion { margin: 18px 0 0; font-size: 20px; line-height: 28px; text-align: center; }
    .flight {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      background: #fff;
      color: #374151;
    }
    .flight img { width: 36px; height: 36px; margin-right: 4px; flex-shrink: 0; }
    .flight span { font-size: 14px; font-weight: 700; line-height: 20px; }
    .features { background: #e7eef3; }
    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 48px 20px 28px;
      color: #1c1c1c;
    }
    .feature.alt {
      color: #fff;
      background-image: linear-gradient(326deg, #5ec8ff 0%, #1a86ea 34%, #0b4ea8 100%);
    }
    .feature-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .feature-copy strong, .feature-copy p { display: block; margin: 0; font-size: 16px; line-height: 26px; font-weight: 400; }
    .phone {
      position: relative;
      width: min(340px, 92%);
      padding: 12px 11px 16px;
      border-radius: 36px;
      background: #2c3344;
      box-shadow: 0 18px 40px rgba(15, 40, 80, 0.22);
    }
    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      left: -3px;
      width: 3px;
      border-radius: 2px 0 0 2px;
      background: #1b2130;
    }
    .phone::before { top: 108px; height: 26px; }
    .phone::after { top: 148px; height: 46px; }
    .screen {
      overflow: hidden;
      border-radius: 26px;
      background: #ededed;
      color: #1f2937;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 2px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .sig { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
    .sig i { display: block; width: 3px; background: #111; border-radius: 1px; }
    .sig i:nth-child(1) { height: 4px; }
    .sig i:nth-child(2) { height: 6px; }
    .sig i:nth-child(3) { height: 8px; }
    .sig i:nth-child(4) { height: 11px; }
    .battery {
      width: 22px;
      height: 11px;
      margin-left: 6px;
      border: 1.5px solid #111;
      border-radius: 2px;
      position: relative;
    }
    .battery::before {
      content: "";
      position: absolute;
      inset: 1px 3px 1px 1px;
      background: #111;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 5px;
      background: #111;
      border-radius: 0 1px 1px 0;
    }
    .status-icons { display: flex; align-items: center; }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 10px;
      background: #fff;
      font-weight: 700;
    }
    .back { color: #9ca3af; font-weight: 400; }
    .bar em { flex: 1; font-style: normal; text-align: center; }
    .chat { padding: 14px 12px 20px; }
    .time { margin: 0 0 12px; color: #9ca3af; font-size: 12px; text-align: center; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-start; }
    .row.mine { justify-content: flex-end; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .a1 { background: #38bdf8; }
    .a2 { background: #34d399; }
    .a3 { background: #fb7185; }
    .bubble {
      max-width: 210px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      line-height: 1.45;
    }
    .row.mine .bubble { background: #c5e8ff; }
    .pic {
      width: 148px;
      height: 92px;
      padding: 0;
      border-radius: 8px;
      background:
        radial-gradient(circle at 78% 26%, #fff4c2 0 7px, transparent 8px),
        linear-gradient(#8fd3ef, #8fd3ef) 0 0 / 100% 55% no-repeat,
        linear-gradient(#9ed48a, #6fbf6a) 0 100% / 100% 50% no-repeat;
    }
    .voice { display: flex; align-items: center; gap: 6px; min-width: 120px; }
    .voice i {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid #3b82f6;
    }
    .voice b { width: 3px; height: 12px; border-radius: 2px; background: #93c5fd; }
    .voice b:nth-child(3) { height: 18px; }
    .voice span { margin-left: auto; color: #6b7280; font-size: 12px; }
    .qr {
      width: 92px;
      height: 92px;
      border-radius: 6px;
      background:
        linear-gradient(#111 0 0) 0 0 / 18px 18px,
        linear-gradient(#111 0 0) 100% 0 / 18px 18px,
        linear-gradient(#111 0 0) 0 100% / 18px 18px,
        repeating-linear-gradient(90deg, #111 0 4px, transparent 4px 8px),
        repeating-linear-gradient(#111 0 4px, #fff 4px 8px);
      background-repeat: no-repeat;
    }
    .name { margin-bottom: 2px; color: #6b7280; font-size: 12px; }
    footer {
      padding: 56px 16px 28px;
      background: #1480dc;
      color: #fff;
      text-align: center;
      font-size: 16px;
    }
    .legal { margin-top: 14px; font-size: 14px; }
    .legal a { margin: 0 10px; text-decoration: underline; }
    @media (min-width: 768px) {
      .logo { width: 176px; height: 176px; border-radius: 40px; }
      .feature {
        flex-direction: row;
        justify-content: center;
        gap: 48px;
        padding: 64px 32px;
      }
      .feature-copy { max-width: 280px; align-items: flex-start; text-align: left; }
      .feature.alt .feature-copy { align-items: flex-end; text-align: right; }
    }
    @media (hover: hover) {
      .pill:hover { box-shadow: 0 0 1.5em rgba(0, 0, 0, 0.35); }
      .lang-btn:hover { background: #2563eb; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="lang" id="lang">
      <button class="lang-btn" type="button" id="langBtn">
        <span id="langName">简体中文</span>
        <i class="lang-caret"></i>
      </button>
      <div class="lang-menu">
        <button class="lang-item active" type="button" data-lang="zh">简体中文</button>
        <button class="lang-item" type="button" data-lang="en">English</button>
      </div>
    </div>
    <div class="hero-inner">
      <img class="logo" src="assets/logo.png" alt="易可聊">
      <div class="subline">
        <span data-t="sub1"></span>
        <span data-t="sub2"></span>
      </div>
      <h1 class="headline"><span data-t="title1"></span><span data-t="title2"></span></h1>
      <a class="pill" href="/app/">
        <img id="storeIcon" src="assets/android.png" alt="">
        <span data-t="download"></span>
      </a>
      <a class="pill pill-lite" href="/">
        <img src="assets/lite.svg" alt="">
        <span data-t="web"></span>
      </a>
      <p class="passion" data-t="passion"></p>
    </div>
    <div class="flight">
      <img src="assets/warn.svg" alt="">
      <span data-t="tip"></span>
    </div>
  </section>

  <section class="features">
    <article class="feature">
      <div class="feature-copy">
        <strong data-t="f1a"></strong>
        <p data-t="f1b"></p>
      </div>
      <div class="phone" aria-hidden="true">
        <div class="screen">
          <div class="status"><span>10:24</span><span class="status-icons"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span></div>
          <div class="bar"><span class="back">‹</span><em data-t="g1"></em></div>
          <div class="chat">
            <p class="time">10:24</p>
            <div class="row"><span class="avatar a1">林</span><div><div class="name" data-t="n1">林晓</div><div class="bubble" data-t="m1"></div></div></div>
            <div class="row"><span class="avatar a1">林</span><div><div class="bubble pic"></div></div></div>
            <div class="row mine"><div class="bubble" data-t="m2"></div><span class="avatar a2">我</span></div>
            <div class="row"><span class="avatar a3">周</span><div><div class="name" data-t="n2">周宁</div><div class="bubble voice"><i></i><b></b><b></b><b></b><span>0:08</span></div></div></div>
            <div class="row mine"><div class="bubble" data-t="m3"></div><span class="avatar a2">我</span></div>
          </div>
        </div>
      </div>
    </article>
    <article class="feature alt">
      <div class="feature-copy">
        <strong data-t="f2a"></strong>
        <p data-t="f2b"></p>
      </div>
      <div class="phone" aria-hidden="true">
        <div class="screen">
          <div class="status"><span>12:06</span><span class="status-icons"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span></div>
          <div class="bar"><span class="back">‹</span><em data-t="g2"></em></div>
          <div class="chat">
            <p class="time">12:06</p>
            <div class="row"><span class="avatar a2">安</span><div><div class="name" data-t="n3">安然</div><div class="bubble" data-t="m4"></div></div></div>
            <div class="row"><span class="avatar a2">安</span><div><div class="bubble"><div class="qr"></div></div></div></div>
            <div class="row mine"><div class="bubble" data-t="m5"></div><span class="avatar a1">我</span></div>
            <div class="row mine"><div class="bubble" data-t="m6"></div><span class="avatar a1">我</span></div>
          </div>
        </div>
      </div>
    </article>
    <article class="feature">
      <div class="feature-copy">
        <strong data-t="f3a"></strong>
        <p data-t="f3b"></p>
      </div>
      <div class="phone" aria-hidden="true">
        <div class="screen">
          <div class="status"><span>09:18</span><span class="status-icons"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span></div>
          <div class="bar"><span class="back">‹</span><em data-t="g3"></em></div>
          <div class="chat">
            <p class="time">09:18</p>
            <div class="row"><span class="avatar a3">陈</span><div><div class="bubble" data-t="m7"></div></div></div>
            <div class="row mine"><div class="bubble" data-t="m8"></div><span class="avatar a2">我</span></div>
            <div class="row"><span class="avatar a3">陈</span><div><div class="bubble" data-t="m9"></div></div></div>
            <div class="row mine"><div class="bubble" data-t="m10"></div><span class="avatar a2">我</span></div>
          </div>
        </div>
      </div>
    </article>
  </section>

  <footer>
    <div>Copyright © 2026 易可聊</div>
    <div class="legal">
      <a href="/static/legal/privacy.html" data-t="privacy"></a>
      <a href="/static/legal/agreement.html" data-t="terms"></a>
      <a href="mailto:qingtian1678@gmail.com" data-t="contact"></a>
    </div>
  </footer>

  <script>
    var copy = {
      zh: {
        lang: "简体中文",
        sub1: "私聊群聊",
        sub2: "多国手机号",
        title1: "随时保持联系",
        title2: "的即时通讯",
        download: "立即下载",
        web: "开启聊天快捷版",
        passion: "和好友、群组随时说上话",
        tip: "下载页提供 iPhone 与 Android 安装包",
        f1a: "文字、图片、语音和文件",
        f1b: "日常聊天需要的内容都能发",
        f2a: "好友和群组",
        f2b: "用聊天号或二维码添加，不展示手机号",
        f3a: "多国手机号注册",
        f3b: "换设备登录后仍可查看消息记录",
        g1: "周末小聚",
        g2: "新的朋友",
        g3: "陈可",
        n1: "林晓",
        n2: "周宁",
        n3: "安然",
        m1: "晚上的图我发群里了。",
        m2: "收到，我看一下。",
        m3: "语音也听完了，周末见。",
        m4: "这是我的聊天号，扫码就能加我。",
        m5: "好，不加手机号也行。",
        m6: "已经加上了。",
        m7: "我用 +1 的号码注册的。",
        m8: "我是 +86，两边互不影响。",
        m9: "换了手机，记录还在。",
        m10: "登录同一个账号就能接着看。",
        privacy: "隐私政策",
        terms: "用户协议",
        contact: "联系我们"
      },
      en: {
        lang: "English",
        sub1: "Chats and groups",
        sub2: "Many countries",
        title1: "A messaging app",
        title2: "for staying in touch",
        download: "Download",
        web: "Open web chat",
        passion: "Message friends and groups anytime",
        tip: "iPhone and Android installers are on the download page",
        f1a: "Text, photos, voice and files",
        f1b: "Send what you need in a conversation",
        f2a: "Friends and groups",
        f2b: "Add people by chat ID or QR code, not by phone number",
        f3a: "Phone numbers from many countries",
        f3b: "Message history stays after you sign in on another device",
        g1: "Weekend plan",
        g2: "New friend",
        g3: "Chen",
        n1: "Lin",
        n2: "Zhou",
        n3: "An",
        m1: "I sent the photo to the group.",
        m2: "Got it, I'll take a look.",
        m3: "Heard the voice note. See you this weekend.",
        m4: "This is my chat ID. Scan the code to add me.",
        m5: "No need to share a phone number.",
        m6: "Added.",
        m7: "I signed up with a +1 number.",
        m8: "Mine is +86. They don't clash.",
        m9: "I changed phones and the history is still here.",
        m10: "Sign in with the same account to keep reading.",
        privacy: "Privacy",
        terms: "Terms",
        contact: "Contact"
      }
    };
    var lang = "zh";
    function apply() {
      var pack = copy[lang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = lang === "zh" ? "易可聊 - 即时通讯" : "Yikeliao - Messaging";
      document.getElementById("langName").textContent = pack.lang;
      document.querySelectorAll("[data-t]").forEach(function (node) {
        node.textContent = pack[node.getAttribute("data-t")] || "";
      });
      document.querySelectorAll(".lang-item").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
      });
    }
    var box = document.getElementById("lang");
    document.getElementById("langBtn").addEventListener("click", function (event) {
      event.stopPropagation();
      box.classList.toggle("open");
    });
    document.querySelectorAll(".lang-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        lang = btn.getAttribute("data-lang");
        box.classList.remove("open");
        apply();
      });
    });
    document.addEventListener("click", function () { box.classList.remove("open"); });
    var ua = navigator.userAgent || "";
    var iPad = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    if (/iPhone|iPad|iPod/i.test(ua) || iPad) {
      document.getElementById("storeIcon").src = "assets/apple.svg";
    }
    apply();
  </script>
</body>
</html>
