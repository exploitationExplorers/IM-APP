# ───────────────────────────────────────────────────────────────────────────
# IM-APP 业务栈（全新部署 · 8.154.44.197 · 纯 IP / 全链路 HTTP）
#
# 与 IM-APP-server/docker-compose.yml 的差异（那份是旧服务器在用的，别混）：
#   1. 新增 admin（IM-APP-admin 管理后台后端）与 nginx 两个服务
#   2. 所有端口只绑 127.0.0.1；公网入口是宝塔面板自带的 nginx（见下）
#   2b. 没有 nginx 容器 —— 宝塔的 nginx 占着 80 且会自动重启，交给它做入口
#   3. 去掉 openim-docker_openim 这个旧网络，只用 im-app-openim-net
#   4. postgres 用容器自带的（库名 imapp），不挂 001_init.sql 到 initdb ——
#      现网默认 MIGRATIONS_MODE=verify，只核验结构；更新只执行审核后的增量 SQL。
#      新空库初始化必须单独规划，不能让生产启动自动重跑整个历史 migrations。
#      宿主上宝塔装的那个 PostgreSQL 与本栈无关，不要用它、也不用手动建库建表。
#   5. 给 api 加 healthcheck，admin 用 service_healthy 等它 —— 见下方 ★ 说明
#
# 启动前必做（只需一次）：
#   docker network create --subnet 172.20.0.0/16 im-app-openim-net
#
# 现有生产环境更新：bash deploy/production.sh inspect，后续按 deploy/PRODUCTION.md。
# 禁止直接整栈 up --build；必须叠加原 OSS 私密 override 和本次增量配置。
# ───────────────────────────────────────────────────────────────────────────

name: im-app

# 容器 stdout 日志上限：避免再出现 openim-api 单文件 90G+ 撑爆磁盘。
# 已有容器需 recreate 后才生效；daemon.json 的 log-opts 同样建议配上。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: im-app-postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: im
      POSTGRES_PASSWORD: im123456
      POSTGRES_DB: imapp
    # ★ 容器默认 nofile 很低（通常 1024）。/etc/security/limits.conf 对容器无效，
    #   只能在 compose 里声明。OpenIM 那边的 mongo 已经因为这个报过
    #   "Too many open files"，所以这里一并给高连接数服务设上。
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - im_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im -d imapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: im-app-redis
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ★ 用 Bitnami 版 MinIO，不是官方 minio/minio。
  #   原因：官方 minio/minio 于 2025-10-23 从 Docker Hub 下架，整个仓库（含历史固定 tag）
  #   都拉不到；quay.io/minio/minio 也只剩部分固定 tag 且国内基本不通（401/超时）。
  #   实测能从 Docker Hub 拉到的只有 bitnamilegacy/minio。
  #   ★ Bitnami 版与官方版行为不同，别按官方版改：
  #     1. 它的 CMD 是 /opt/bitnami/scripts/minio/run.sh —— 不能写
  #        `command: server /data --console-address ":9001"` 去覆盖，否则入口脚本
  #        会去找一个叫 server 的可执行文件，容器直接起不来。
  #     2. 以非 root(1001) 运行 —— 数据卷必须挂在 /bitnami/minio/data。
  #        该目录在镜像里属主就是 1001，Docker 初始化命名卷时会连同属主一起拷贝，
  #        所以卷才写得进去。挂 /data 会因为卷属主是 root 而权限失败。
  #     3. 端口与凭证走 MINIO_* 环境变量，不走命令行参数。
  minio:
    image: bitnamilegacy/minio:latest
    container_name: im-app-minio
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - im_minio_data:/bitnami/minio/data
    healthcheck:
      # 仅用于展示状态；★ 不要让任何服务 depends_on 这个 healthcheck ——
      # 镜像里 curl 是否存在随版本变化，误报 unhealthy 会连带整栈起不来。
      # api 对 minio 只用 service_started 排顺序，连不上会自己降级（日志 minio disabled）。
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: im-app-kafka
    logging: *default-logging
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - im_kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  # Go 主后端；现网 verify 模式只核验结构，不自动重跑历史 SQL。
  api:
    build: ../IM-APP-server
    container_name: im-app-api
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      # ★ 这个 healthcheck 是 admin 的启动闸门，别删。
      # IM-APP-admin 的 migrations/001_admin.sql 会 ALTER 业务库的
      # users / groups / group_members 表；业务表不存在时 admin 会
      # log.Fatalf 直接退出。api 只有跑完 migrations + RequireColumns
      # 校验通过才会开始监听 :8080，所以「api healthy」就是「业务表已就绪」。
      # alpine 自带 busybox wget。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    environment:
      HTTP_ADDR: ":8080"
      # 变量模板/映射不包含真实凭据。现网 production.sh 会继续叠加原 OSS 私密配置。
      APP_ENV: ${APP_ENV:-oss-production}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-oss}
      MIGRATIONS_MODE: ${MIGRATIONS_MODE:-verify}
      OSS_REGION: ${OSS_REGION:-cn-hongkong}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-hongkong.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_SESSION_TOKEN: ${OSS_SESSION_TOKEN:-}
      OSS_KEY_PREFIX: ${OSS_KEY_PREFIX:-im-app-production/business/}
      OSS_PUBLIC_UPLOAD_URL: ${OSS_PUBLIC_UPLOAD_URL:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      OSS_MEDIA_PROXY_URL: ${OSS_MEDIA_PROXY_URL:-}
      OSS_MEDIA_SIGNING_KEY: ${OSS_MEDIA_SIGNING_KEY:-}
      MEDIA_SOURCE_URL_PREFIXES: ${MEDIA_SOURCE_URL_PREFIXES:-}
      # 转发/收藏下载前，把会过期的签名直连地址换成不过期的 CDN 地址。
      # 规则形如 "https://源前缀->https://CDN前缀"；留空 = 不改写（默认）。
      # ★ CDN 目标前缀必须同时出现在 MEDIA_SOURCE_URL_PREFIXES 白名单里，
      #   否则改写后的地址会被拒绝下载（fail closed）。
      MEDIA_CDN_REWRITES: ${MEDIA_CDN_REWRITES:-}
      GROUP_RETENTION_MODE: ${GROUP_RETENTION_MODE:-visibility_only}
      GROUP_RETENTION_ADAPTER_URL: ${GROUP_RETENTION_ADAPTER_URL:-}
      GROUP_RETENTION_ADAPTER_KEY: ${GROUP_RETENTION_ADAPTER_KEY:-}
      GROUP_RETENTION_GROUP_IDS: ${GROUP_RETENTION_GROUP_IDS:-}
      GROUP_RETENTION_ALL_GROUPS: ${GROUP_RETENTION_ALL_GROUPS:-true}
      FAVORITE_ARCHIVE_WORKER_ENABLED: ${FAVORITE_ARCHIVE_WORKER_ENABLED:-false}
      DATABASE_URL: postgres://im:im123456@postgres:5432/imapp?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-im-local-dev-secret-change-me}
      DEV_SMS_CODE: ${DEV_SMS_CODE:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      SMS_REGION_ID: ${SMS_REGION_ID:-cn-hangzhou}
      # ── 验证码发送节流（手机号 / 设备指纹 / DeviceID / IP 农场）──
      # 只做频率节流，不设次数配额：原来「每 IP 5 次/小时」「每手机号 10 次/天」
      # 已去掉，免得 NAT、校园网、运营商大内网下共用出口 IP 的正常用户被误伤。
      # 主力是「同一手机号 60 秒一条」；任一项配 0 即关闭该维度。
      SMS_PHONE_MIN_INTERVAL: ${SMS_PHONE_MIN_INTERVAL:-60}
      SMS_FP_LIMIT: ${SMS_FP_LIMIT:-30}
      SMS_FP_WINDOW: ${SMS_FP_WINDOW:-3600}
      SMS_DEVICE_LIMIT: ${SMS_DEVICE_LIMIT:-20}
      SMS_DEVICE_WINDOW: ${SMS_DEVICE_WINDOW:-3600}
      SMS_IP_MAX_FPS: ${SMS_IP_MAX_FPS:-10}
      SMS_IP_FARM_BLOCK_SEC: ${SMS_IP_FARM_BLOCK_SEC:-600}
      SMS_BLACKLIST_ENABLED: ${SMS_BLACKLIST_ENABLED:-true}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: im-uploads
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
      # ── OpenIM 对接：走共享网络 im-app-openim-net，用服务名 openim-api ──
      OPENIM_API_URL: ${OPENIM_API_URL:-http://openim-api:10002}
      OPENIM_PUBLIC_API_URL: ${OPENIM_PUBLIC_API_URL:-}
      OPENIM_PUBLIC_WS_URL: ${OPENIM_PUBLIC_WS_URL:-}
      OPENIM_SECRET: ${OPENIM_SECRET:-}
      OPENIM_ADMIN_USER: ${OPENIM_ADMIN_USER:-imAdmin}
      OPENIM_WEBHOOK_SECRET: ${OPENIM_WEBHOOK_SECRET:-}
      # 允许 OpenIM 回调 webhook 的来源网段 = im-app-openim-net 的 Subnet。
      # 建网时用 --subnet 172.20.0.0/16 就是这个原因；空了 webhook 会全部 403。
      OPENIM_WEBHOOK_ALLOW_CIDRS: ${OPENIM_WEBHOOK_ALLOW_CIDRS:-}
      OPENIM_RECALL_WINDOW_SECONDS: ${OPENIM_RECALL_WINDOW_SECONDS:-120}
      IM_INTERNAL_API_KEY: ${IM_INTERNAL_API_KEY:-}
      GROUP_MEMBER_HARD_LIMIT: ${GROUP_MEMBER_HARD_LIMIT:-4000}
      # 群成员上限。正常情况下该由管理后台「系统限制」页保存并发布
      # （app_config_versions 里 status='published' 的那一版）；管理后台没部署时，
      # 这两个环境变量直接把上限钉住（设了就优先于后台发布的配置）。
      # ★ 只调这两个还不够：存量群的 groups.max_members 是每群一行的独立列，
      #   由 migrations/045 抬到 2000，否则老群仍被自己那行的 200 卡住。
      # 想交回管理后台托管，把这两行删掉或从 .env 里注空即可。
      GROUP_MEMBER_MAX: ${GROUP_MEMBER_MAX:-2000}
      DEFAULT_GROUP_MAX_MEMBERS: ${DEFAULT_GROUP_MAX_MEMBERS:-2000}
      LEGACY_CHAT_ENABLED: ${LEGACY_CHAT_ENABLED:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      FORWARD_WORKER_ENABLED: ${FORWARD_WORKER_ENABLED:-true}
      FORWARD_BATCH_SIZE: ${FORWARD_BATCH_SIZE:-50}
      FORWARD_MAX_ATTEMPTS: ${FORWARD_MAX_ATTEMPTS:-8}
      FORWARD_CONCURRENCY: ${FORWARD_CONCURRENCY:-4}
      FORWARD_QPS: ${FORWARD_QPS:-20}
      FORWARD_POLL_SECONDS: ${FORWARD_POLL_SECONDS:-2}
      FORWARD_LOCK_SECONDS: ${FORWARD_LOCK_SECONDS:-300}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      KAFKA_FORWARD_TOPIC: ${KAFKA_FORWARD_TOPIC:-im-forward-tasks}
      KAFKA_FORWARD_GROUP_ID: ${KAFKA_FORWARD_GROUP_ID:-im-forward-workers}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      CAPTCHA_REGION_ID: ${CAPTCHA_REGION_ID:-cn-hangzhou}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    ports:
      - "127.0.0.1:8080:8080"
    # default 用于连 postgres/redis/minio/kafka；
    # im-app-openim-net 用于连 openim-api，也让 OpenIM 能回调本服务的 webhook。
    networks:
      - default
      - im-app-openim-net
    restart: unless-stopped

  # Go 管理后台后端；同样自带 migrations（10 个 sql，幂等）
  admin:
    build: ../IM-APP-admin
    container_name: im-admin
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      # ★ 必须是 service_healthy，不能用 service_started —— 见 api 的 healthcheck 说明
      api:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8090"
      DATABASE_URL: postgres://im:im123456@postgres:5432/imapp?sslmode=disable
      GIN_MODE: ${GIN_MODE:-release}
      # release 模式下 ADMIN_JWT_SECRET 短于 32 字符会拒绝启动（config.WeakJWTSecret）
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      # 仅首次启动、且 admin_users 为空时创建超管；之后改这个值不生效
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-}
      # 走同栈服务名；写操作靠 X-Internal-API-Key 调 server 内部接口
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://api:8080}
      SERVER_INTERNAL_KEY: ${SERVER_INTERNAL_KEY:-}
      GROUP_MEMBER_HARD_LIMIT: ${GROUP_MEMBER_HARD_LIMIT:-4000}
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  # ★ 这里没有 nginx 容器：服务器上装了宝塔面板，宝塔自带的 nginx 已占用 80 端口，
  #   且宝塔会监控并自动把 nginx 拉起来 —— 跟它抢 80 是打不赢的。
  #   所以公网入口交给宝塔的 nginx，配置见 deploy/baota/im-app.conf
  #   （安装步骤见操作手册）。
  #   本栈所有端口都只绑 127.0.0.1，宝塔的 nginx 在宿主上直接反代过去。

volumes:
  im_pg_data:
  im_minio_data:
  im_kafka_data:

# 与 deploy/openim/docker-compose.yml 共享；启动前必须已创建：
#   docker network create --subnet 172.20.0.0/16 im-app-openim-net
networks:
  im-app-openim-net:
    external: true
