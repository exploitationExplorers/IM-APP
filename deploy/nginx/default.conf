# ───────────────────────────────────────────────────────────────────────────
# IM-APP nginx：唯一对外入口
#
#   :80   → H5 客户端 + 业务 API + OpenIM API/WS + 两个对象存储
#   :8081 → 管理后台（IM-APP-system 前端 + /api 转发到 im-admin）
#
# 管理后台为什么单独占 8081 而不是 /admin/ 子路径：
#   IM-APP-system/.env.production 里 VITE_PUBLIC_PATH=/，产物资源路径写死
#   /assets/...，放子路径必须改基础路径并重新构建。给它独立端口当站点根，
#   前端一行都不用改（它自己的 VITE_API_URL=/api 本来就是相对路径）。
#
# ★ 前缀保留 / 剥离的方向是反的，改动前先看清：
#   /api/      → 不剥前缀（后端路由本身就是 /api/v1/...）
#   /openim-api/ /openim/ /minio/ → 剥掉前缀（对象存储签名算的是剥掉后的路径）
# ───────────────────────────────────────────────────────────────────────────

# 所有上游地址都用「变量 + resolver」延迟解析，而不是 proxy_pass http://名字。
# 好处：某个上游还没起时 nginx 仍能正常启动，只在请求时返回 502，
# 不会因为 "host not found in upstream" 直接拒绝启动（否则必须严格按顺序启动）。
# 127.0.0.11 是 Docker 内置 DNS；valid=10s 让容器重建换 IP 后能重新解析。
# 代价：用变量后 nginx 不再自动剥前缀，需要剥的地方显式 rewrite ... break。

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/h5;
    index index.html;
    client_max_body_size 200m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # H5 构建产物文件名带 hash，可以长缓存
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查（H5 的 debug-probe 会打这个地址）
    location = /health {
        set $up_api http://api:8080;
        proxy_pass $up_api;
        proxy_set_header Host $host;
    }

    # 业务 Go API：保留 /api 前缀
    location ^~ /api/ {
        set $up_api http://api:8080;
        proxy_pass $up_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # OpenIM WebSocket 网关：必须带 Upgrade 头，否则握手失败
    location ^~ /openim-ws {
        set $up_openim_ws http://openim-api:10001;
        proxy_pass $up_openim_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OpenIM 管理 API：剥掉 /openim-api 前缀
    location ^~ /openim-api/ {
        set $up_openim_api http://openim-api:10002;
        rewrite ^/openim-api/(.*)$ /$1 break;
        proxy_pass $up_openim_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 业务 MinIO：剥掉 /minio 前缀。
    # ★ Host 必须是 $host（= 8.154.44.197），不能是默认的 $proxy_host ——
    #   预签名 URL 的签名把 host 算进去了，Host 头不对会 SignatureDoesNotMatch。
    location ^~ /minio/ {
        set $up_minio http://minio:9000;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass $up_minio;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenIM MinIO（聊天图片/语音/文件）：同样剥前缀 + 保留 Host
    location ^~ /openim/ {
        set $up_openim_minio http://openim-minio:9000;
        rewrite ^/openim/(.*)$ /$1 break;
        proxy_pass $up_openim_minio;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # H5 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;
    client_max_body_size 200m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 管理后台 API：同样保留 /api 前缀（后端路由是 /api/admin/v1/...）
    location ^~ /api/ {
        set $up_admin http://admin:8090;
        proxy_pass $up_admin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
