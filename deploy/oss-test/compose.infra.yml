# Independent test data services only. Do not merge with production Compose files.
# Validate first: node deploy/oss-test/validate-config.cjs
name: im-app-oss-test

x-defaults: &defaults
  restart: unless-stopped
  networks: [data]
  labels:
    im.app.environment: oss-test
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oss_test_admin
      POSTGRES_DB: imapp_oss_test
      POSTGRES_PASSWORD: ${TEST_PG_ADMIN_PASSWORD:?initialize the test .env first}
      TEST_PG_APP_PASSWORD: ${TEST_PG_APP_PASSWORD:?initialize the test .env first}
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-test-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U oss_test_admin -d imapp_oss_test']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *defaults
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${TEST_REDIS_PASSWORD:?initialize the test .env first}"]
    environment:
      REDISCLI_AUTH: ${TEST_REDIS_PASSWORD:?initialize the test .env first}
    ports: ["127.0.0.1:16379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  openim-mongodb:
    <<: *defaults
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: oss_test_admin
      MONGO_INITDB_ROOT_PASSWORD: ${TEST_MONGO_ROOT_PASSWORD:?initialize the test .env first}
      MONGO_INITDB_DATABASE: openim_oss_test
      TEST_MONGO_APP_PASSWORD: ${TEST_MONGO_APP_PASSWORD:?initialize the test .env first}
    ports: ["127.0.0.1:27027:27017"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/10-test-user.js:ro
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --username oss_test_admin --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand({ping:1})"']
      interval: 10s
      timeout: 5s
      retries: 20
    ulimits:
      nofile: {soft: 64000, hard: 64000}

  openim-redis:
    <<: *defaults
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${TEST_OPENIM_REDIS_PASSWORD:?initialize the test .env first}"]
    environment:
      REDISCLI_AUTH: ${TEST_OPENIM_REDIS_PASSWORD:?initialize the test .env first}
    ports: ["127.0.0.1:16380:6379"]
    volumes: [openim_redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  openim-etcd:
    <<: *defaults
    image: bitnamilegacy/etcd:3.5
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_NAME: oss-test
      ETCD_DATA_DIR: /bitnami/etcd/data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://openim-etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://openim-etcd:2380
      ETCD_INITIAL_CLUSTER: oss-test=http://openim-etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: im-app-oss-test
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes: [etcd_data:/bitnami/etcd]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    <<: *defaults
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30

  openim-kafka:
    <<: *defaults
    image: bitnamilegacy/kafka:3.6
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@openim-kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://openim-kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [openim_kafka_data:/bitnami/kafka]
    healthcheck:
      test: [CMD-SHELL, '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30

  minio-source:
    <<: *defaults
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_ACCESS_KEY:?initialize the test .env first}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_SECRET_KEY:?initialize the test .env first}
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_DEFAULT_BUCKETS: im-uploads-oss-test
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: [minio_source_data:/bitnami/minio/data]

  openim-minio-source:
    <<: *defaults
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${TEST_OPENIM_MINIO_ACCESS_KEY:?initialize the test .env first}
      MINIO_ROOT_PASSWORD: ${TEST_OPENIM_MINIO_SECRET_KEY:?initialize the test .env first}
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_DEFAULT_BUCKETS: openim-oss-test
    ports: ["127.0.0.1:19100:9000", "127.0.0.1:19101:9001"]
    volumes: [openim_minio_source_data:/bitnami/minio/data]

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  openim_redis_data:
  etcd_data:
  kafka_data:
  openim_kafka_data:
  minio_source_data:
  openim_minio_source_data:

networks:
  data:
    internal: true
    ipam:
      config: [{subnet: 172.30.187.0/24}]
