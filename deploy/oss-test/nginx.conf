events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Media capability tokens and SDK query tokens must not enter access/error logs.
  access_log off;
  error_log /dev/stderr crit;
  server_tokens off;
  client_max_body_size 25m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Docker DNS permits independent restarts without caching stale container IPs.
  resolver 127.0.0.11 valid=5s;
  server { listen 8088; location = /health { return 200 'oss-test'; } }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.pem;
    ssl_certificate_key /etc/nginx/tls/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/front;
    location /api/ {
      set $business http://api:8080;
      proxy_pass $business$request_uri;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location = /health { set $business http://api:8080; proxy_pass $business/health; }
    location /openim-api/ {
      # 测试入口与生产保持一致，客户端关系写入必须经过业务审批。
      if ($uri ~* "^/openim-api/(friend/(add_friend|add_friend_response|import_friend)|group/(create_group|invite_user_to_group|join_group))/?$") {
        return 403;
      }
      # Nginx rewrite 'break' skips later rewrite-module directives, including
      # 'set'. Initialize the upstream first or proxy_pass receives an empty URL.
      set $openim_api http://openim-api:10002;
      rewrite ^/openim-api/(.*)$ /$1 break;
      proxy_pass $openim_api$uri$is_args$args;
      proxy_set_header Host $http_host;
      # OpenIM uses this exact base to build its stable private object URLs.
      # Override client input; never return internal/plain-HTTP Docker addresses.
      proxy_set_header X-Request-Api https://localhost:18443/openim-api;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /openim-ws {
      set $gateway http://openim-msggateway:10001;
      proxy_pass $gateway/$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }
    # Do not proxy unknown legacy object hosts to production.
    location / { try_files $uri $uri/ /index.html; }
  }
  server {
    listen 8444 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.pem;
    ssl_certificate_key /etc/nginx/tls/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/admin;
    location /api/ {
      set $admin http://admin:8090;
      proxy_pass $admin$request_uri;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
