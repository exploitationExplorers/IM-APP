# ───────────────────────────────────────────────────────────────────────────
# IM-APP 公网入口（宝塔面板 nginx）
#
# 为什么不用 nginx 容器：服务器装了宝塔，宝塔自带的 nginx 占着 80 端口，
# 而且宝塔面板会监控并自动重启 nginx —— 停不掉、抢不过，所以直接把入口交给它。
#
# 安装（在服务器上）：
#   cp /www/wwwroot/deploy/baota/im-app.conf /www/server/panel/vhost/nginx/im-app.conf
#   /www/server/nginx/sbin/nginx -t          # 必须先测语法
#   /www/server/nginx/sbin/nginx -s reload
#
# ★ 改动本文件后必须重新 cp 过去再 reload —— 宝塔不认仓库里的这份。
#   （宝塔面板的「网站」页面不会显示这个站点，因为它不是面板创建的；
#     要改就用文件管理器编辑 /www/server/panel/vhost/nginx/im-app.conf）
#
# 上游全部是 127.0.0.1：业务栈和 OpenIM 栈的端口都只绑回环，宝塔 nginx 在宿主上直连。
# 对应关系：
#   127.0.0.1:8080  → im-app-api（业务后端）
#   127.0.0.1:8090  → im-admin（管理后台后端）
#   127.0.0.1:9000  → 业务 MinIO
#   127.0.0.1:9100  → OpenIM MinIO
#   127.0.0.1:10001 → OpenIM WS 网关
#   127.0.0.1:10002 → OpenIM API
#
# ★ 前缀保留 / 剥离方向是反的，改之前看清：
#   /api/       不剥前缀（后端路由本身就是 /api/v1/...）
#   /object/    不剥前缀（前缀就是桶名，见下面那段注释）
#   /openim-api/ /openim/ /minio/  剥掉前缀（对象存储签名算的是剥掉后的路径）
# ───────────────────────────────────────────────────────────────────────────

# ═════════════ :80 ═════════════
# H5 客户端 + 业务 API + OpenIM + 对象存储
server {
    listen 80;
    # 不用 default_server：宝塔的默认站点已经占了。按 IP 访问时 Host 就是它，能匹配上。
    server_name 8.154.44.197;

    root /www/wwwroot/deploy/web/h5;
    index index.html;
    client_max_body_size 200m;

    access_log /www/wwwlogs/im-app-h5.log;
    error_log  /www/wwwlogs/im-app-h5.error.log;

    # 健康检查（H5 的 debug-probe 会打这个地址）
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }

    # 业务 Go API —— 保留 /api 前缀
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # OpenIM WebSocket 网关 —— 必须带 Upgrade 头，否则握手失败
    location ^~ /openim-ws {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OpenIM 管理 API —— 剥掉 /openim-api 前缀
    location ^~ /openim-api/ {
        rewrite ^/openim-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:10002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 业务 MinIO —— 剥掉 /minio 前缀
    # ★ Host 必须是 $host（= 8.154.44.197）。预签名 URL 的签名把 host 算进去了，
    #   用默认的 $proxy_host（127.0.0.1:9000）会 SignatureDoesNotMatch。
    location ^~ /minio/ {
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenIM MinIO（聊天图片/语音/文件）—— 同样剥前缀 + 保留 Host
    location ^~ /openim/ {
        rewrite ^/openim/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OpenIM 对象直链 —— ★ 不剥前缀（前缀就是桶名）
    #
    # 客户端拿到的聊天图片地址形如 http://8.154.44.197/object/<userID>/<时间戳>.png，
    # 即「桶 object + key <userID>/<时间戳>.png」，OpenIM 拼出来的地址不带 /openim 前缀。
    # 少了这条路由，请求会落到最下面的 SPA 回退（try_files → /index.html），
    # 而 8.154.44.197 上没部署 H5、index.html 不存在，于是 nginx 直接返 500 ——
    # 表现为聊天图片全部加载失败。
    #
    # 前提：OpenIM MinIO 上要有 object 桶且为公开读（GET 匿名可取）。
    # 桶由 OpenIM 首次上传时创建；若像 2026-10-05 那次一样没建成，用管理员凭据补建：
    #   PUT http://8.154.44.197/openim/object/          （经 /openim/ 前缀，MinIO 收到 /object/）
    #   PUT http://8.154.44.197/openim/object/?policy   （内容同 Go 后端给 im-uploads 写的那份）
    location ^~ /object/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # H5 静态资源长缓存（文件名带 hash）
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # H5 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ═════════════ :8081 ═════════════
# 管理后台（前端 + API 同源）
#
# 为什么单独占一个端口而不是 /admin/ 子路径：
#   IM-APP-system 的 VITE_PUBLIC_PATH=/，产物资源路径写死 /assets/...，
#   放子路径必须改基础路径并重新构建。给它一个独立端口当站点根，前端一行都不用改。
server {
    listen 8081;
    server_name 8.154.44.197;

    root /www/wwwroot/deploy/web/admin;
    index index.html;
    client_max_body_size 200m;

    access_log /www/wwwlogs/im-app-admin.log;
    error_log  /www/wwwlogs/im-app-admin.error.log;

    # 管理后台 API —— 保留 /api 前缀（后端路由是 /api/admin/v1/...）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
