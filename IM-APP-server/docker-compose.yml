# Phase 1–3: postgres + api + redis + minio
# Phase 4+: OpenIM 独立 compose，见 deploy/openim/docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: im-app-postgres
    environment:
      POSTGRES_USER: im
      POSTGRES_PASSWORD: im123456
      POSTGRES_DB: im_app
    ports:
      - "5433:5432"
    volumes:
      - im_pg_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im -d im_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: im-app-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: im-app-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - im_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: im-app-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://im:im123456@postgres:5432/im_app?sslmode=disable
      JWT_SECRET: im-local-dev-secret-change-me
      DEV_SMS_CODE: "123456"
      # 阿里云短信（值从同目录 .env 读取；AccessKey 用下方共用配置）
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      SMS_REGION_ID: ${SMS_REGION_ID:-cn-hangzhou}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: im-uploads
      MINIO_USE_SSL: "false"
      # MinIO 对外访问地址（预签名 URL 用，值从同目录 .env 读取；如 http://8.210.72.157:9000）
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      # ── OpenIM 对接配置（与 deploy/openim/docker-compose.yml 同源，详见 .env.example）──
      # 后端内部连 OpenIM API：同共享网络直接用服务名 openim-api:10002。
      # OPENIM_SECRET 必须与 OpenIM 的 IMENV_SHARE_SECRET 一致（两者都读宿主 OPENIM_SECRET 变量）。
      OPENIM_API_URL: ${OPENIM_API_URL:-http://openim-api:10002}
      OPENIM_PUBLIC_API_URL: ${OPENIM_PUBLIC_API_URL:-}
      OPENIM_PUBLIC_WS_URL: ${OPENIM_PUBLIC_WS_URL:-}
      OPENIM_SECRET: ${OPENIM_SECRET:-}
      OPENIM_ADMIN_USER: ${OPENIM_ADMIN_USER:-imAdmin}
      OPENIM_WEBHOOK_SECRET: ${OPENIM_WEBHOOK_SECRET:-}
      # 允许 OpenIM 容器回调 webhook 的来源网段；填共享网络 im-app-openim-net 的 Subnet。
      OPENIM_WEBHOOK_ALLOW_CIDRS: ${OPENIM_WEBHOOK_ALLOW_CIDRS:-}
      IM_INTERNAL_API_KEY: ${IM_INTERNAL_API_KEY:-}
      LEGACY_CHAT_ENABLED: ${LEGACY_CHAT_ENABLED:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      # 阿里云验证码（值从同目录 .env 读取，勿写明文）
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      CAPTCHA_REGION_ID: ${CAPTCHA_REGION_ID:-cn-hangzhou}
    ports:
      - "8080:8080"
    # 接入与 OpenIM 共享的外部网络，使本服务能用服务名 openim-api:10002 访问 OpenIM，
    # 同时 OpenIM 也能用 im-app-api:8080 回调本服务的 webhook。
    # 启动前需先创建该网络：docker network create im-app-openim-net
    networks:
      - default
      - im-app-openim-net

volumes:
  im_pg_data:
  im_minio_data:

# 与 deploy/openim/docker-compose.yml 共享的外部网络；
# 启动前需先创建：docker network create im-app-openim-net
networks:
  im-app-openim-net:
    external: true
