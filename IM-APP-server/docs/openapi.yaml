      operationId: deleteFavorite
      x-change-type: existing
      security: [{bearerAuth: []}]
      parameters:
        - name: favoriteId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/UUID'}
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/forward-tasks:
    post:
      tags: [Forward]
      summary: 创建异步万人转发草稿任务
      description: |
        转发总人数不设业务上限。创建接口可直接传入全部 targetUserIds，服务端会按 1000 条一批持久化；
        也可通过 add 或 generate 继续分批写入。任务状态保存在 PostgreSQL，提交后由 Kafka 异步派发。
      operationId: createForwardTask
      x-change-type: optimized
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateForwardTaskRequest'}
      responses:
        '200': {$ref: '#/components/responses/ForwardTaskResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Forward]
      summary: 分页查询当前用户的转发任务
      operationId: listForwardTasks
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ForwardTaskStatusQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/TaskLimitQuery'
      responses:
        '200': {$ref: '#/components/responses/ForwardTaskPageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/forward-tasks/{id}:
    get:
      deprecated: true
      tags: [Forward]
      summary: 查询转发任务进度（旧兼容路径）
