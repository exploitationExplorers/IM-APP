            schema: {$ref: '#/components/schemas/ForwardTargetsRequest'}
      responses:
        '200': {$ref: '#/components/responses/AffectedCountResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/forward-task-targets/clear:
    post:
      tags: [Forward]
      summary: 清空草稿任务的全部目标
      operationId: clearForwardTaskTargets
      x-change-type: new
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardTaskActionRequest'}
      responses:
        '200': {$ref: '#/components/responses/AffectedCountResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/forward-tasks/submit:
    post:
      tags: [Forward]
      summary: 提交转发任务并写入 Kafka Outbox
      operationId: submitForwardTask
      x-change-type: new
      security: [{bearerAuth: []}]
      requestBody:
        required: true
