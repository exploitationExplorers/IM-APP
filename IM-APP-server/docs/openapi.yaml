        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/forward-tasks/retry:
    post:
      tags: [Forward]
      summary: 重试失败目标或指定目标
      operationId: retryForwardTask
      x-change-type: new
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetryForwardTaskRequest'}
      responses:
        '200': {$ref: '#/components/responses/AffectedCountResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/v1/forward-tasks/pause:
    post:
      tags: [Forward]
      summary: 暂停转发任务
      operationId: pauseForwardTask
      x-change-type: new
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardTaskActionRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

