      operationId: getForwardTaskLegacy
      x-change-type: existing
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/UUID'}
      responses:
        '200': {$ref: '#/components/responses/ForwardTaskResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

