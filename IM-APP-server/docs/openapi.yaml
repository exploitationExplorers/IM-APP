      operationId: beforeSendSingleMessage
      security: []
      x-change-type: new
      parameters:
        - $ref: '#/components/parameters/WebhookSecret'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenIMWebhookMessage'}
      responses:
        '200': {$ref: '#/components/responses/WebhookResponse'}
        '400': {$ref: '#/components/responses/WebhookResponse'}
        '404': {description: 密钥或来源 IP 不通过时隐藏接口}

  /internal/openim/webhooks/{secret}/callbackBeforeSendGroupMsgCommand:
    post:
