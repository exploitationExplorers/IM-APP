  /health:
    get:
      tags: [Health]
      summary: 服务存活检查
      description: 无需登录；按来源 IP 每分钟最多请求 20 次。
      operationId: getHealth
      security: []
      x-change-type: optimized
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResult'}
        '429':
          description: 请求过于频繁

  /api/v1/public/countries:
    get:
      tags: [Public Config]
      summary: 查询已启用的国家和国际电话区号
      description: 登录、注册前即可调用。
      operationId: listEnabledCountries
      security: []
      x-change-type: new
      responses:
        '200': {$ref: '#/components/responses/CountriesResponse'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/favorites:
    post:
