    post:
      tags: [Forward]
      summary: 恢复转发任务并重新派发 Kafka 事件
      operationId: resumeForwardTask
      x-change-type: new
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardTaskActionRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /internal/im/messages:
    post:
      tags: [OpenIM Internal]
      summary: 发送幂等的系统消息或业务通知
      operationId: sendInternalOpenIMMessage
      x-change-type: new
      security: [{internalApiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IMSystemMessageRequest'}
      responses:
        '200': {$ref: '#/components/responses/IMSystemMessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /internal/im/health:
    get:
      tags: [OpenIM Internal]
      summary: 检查 OpenIM、管理员 Token 和同步任务状态
      operationId: getInternalOpenIMHealth
      x-change-type: new
      security: [{internalApiKey: []}]
      responses:
        '200': {$ref: '#/components/responses/IMHealthResponse'}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}

  /internal/im/reconcile:
    post:
      tags: [OpenIM Internal]
      summary: 创建全量 OpenIM 对账同步任务
      operationId: reconcileOpenIM
      x-change-type: new
      security: [{internalApiKey: []}]
      responses:
        '200': {$ref: '#/components/responses/IMReconcileResponse'}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /internal/im/outbox:
    get:
      tags: [OpenIM Internal]
      summary: 查询 OpenIM 同步任务
      operationId: listOpenIMOutbox
      x-change-type: new
      security: [{internalApiKey: []}]
      parameters:
        - name: status
          in: query
          description: 按同步任务状态筛选；不传时查询全部状态。
          schema:
            type: string
            enum: [pending, processing, retry, completed, dead]
        - name: limit
          in: query
          description: 最多返回的任务数量，默认 100 条，最大 500 条。
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200': {$ref: '#/components/responses/IMOutboxResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /internal/im/outbox/{id}/replay:
    post:
      tags: [OpenIM Internal]
      summary: 重放 OpenIM 死信同步任务
      operationId: replayOpenIMOutbox
      x-change-type: new
      security: [{internalApiKey: []}]
      parameters:
        - name: id
          in: path
          required: true
          description: 要重放的 OpenIM 同步任务自增 ID，只允许重放死信任务。
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/ReplayResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

