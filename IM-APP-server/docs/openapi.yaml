openapi: 3.0.3
info:
  title: IM-APP 后端增量接口
  version: 1.2.0
  description: |
    包含 OpenIM 对接、会话设置、万人转发、收藏、国家区号、群备注、用户举报中新增或实际优化过的 Go 后端接口。
    不包含未改动的普通登录、短信、用户查询、文件上传和旧 Go 对话接口。

    PostgreSQL 保存业务身份、好友、群组、转发任务状态、Kafka Outbox、同步任务和审计元数据；
    Kafka 承担万人转发的异步派发和消费，转发总人数不设业务上限；
    OpenIM + MongoDB 负责消息、会话、历史记录和 WebSocket。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
  - url: http://8.210.72.157:8080
    description: 服务器示例（按实际部署修改）
tags:
  - name: Auth Sync
    description: 注册及资料同步到 OpenIM
  - name: Contact Sync
    description: 好友、黑名单关系及 OpenIM 同步
  - name: Group Sync
    description: 群资料、成员、权限及 OpenIM 同步
  - name: Reports
    description: 用户举报原因和举报工单
  - name: Forward
    description: Kafka 异步万人转发任务及目标管理
  - name: Favorites
    description: OpenIM 消息快照收藏
  - name: Public Config
    description: 登录前可读取的公共配置
  - name: Health
    description: 服务存活检查
  - name: OpenIM Client
    description: 客户端连接 OpenIM 所需接口
  - name: OpenIM Internal
    description: 仅供可信后端和运维调用
  - name: OpenIM Webhook
    description: 仅供 OpenIM Server 回调

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth Sync]
      summary: 注册业务用户并创建 OpenIM 同步任务
      description: 原注册接口已优化，前端不需要额外调用同步接口。
      operationId: registerAndSyncOpenIM
      security: []
      x-change-type: optimized
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/me:
    patch:
      tags: [Auth Sync]
      summary: 更新用户资料并同步 OpenIM
      operationId: updateProfileAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '200': {$ref: '#/components/responses/MeResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/contacts/{id}:
    delete:
      tags: [Contact Sync]
      summary: 删除好友并同步 OpenIM
      operationId: deleteFriendAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/contacts/{id}/block:
    post:
      tags: [Contact Sync]
      summary: 拉黑用户、解除好友关系并同步 OpenIM
      operationId: blockUserAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Contact Sync]
      summary: 解除拉黑并同步 OpenIM
      operationId: unblockUserAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/friend-requests/{id}/accept:
    post:
      tags: [Contact Sync]
      summary: 接受好友申请并同步 OpenIM
      operationId: acceptFriendRequestAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/groups:
    get:
      tags: [Group Sync]
      summary: 查询当前用户的有效群聊
      description: 已优化为排除解散状态的群。
      operationId: listActiveGroups
      x-change-type: optimized
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/GroupsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Group Sync]
      summary: 创建业务群并同步到 OpenIM
      description: 至少需要 3 名有效成员（包含群主），memberIds 不包含群主本人也可以。
      operationId: createGroupAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/groups/{id}:
    get:
      tags: [Group Sync]
      summary: 查询有效群详情
      operationId: getActiveGroup
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/groups/{id}/members:
    get:
      tags: [Group Sync]
      summary: 查询有效群成员
      operationId: listActiveGroupMembers
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/GroupMembersResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/groups/{id}/join:
    post:
      tags: [Group Sync]
      summary: 加入群并同步 OpenIM
      operationId: joinGroupAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/groups/{id}/qrcode:
    get:
      tags: [Group Sync]
      summary: 获取群二维码字符串
      description: 所有有效群成员可获取；前端使用 payload 生成二维码图片。
      operationId: getGroupQRCodePayload
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/GroupQRCodeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/groups/qrcode/resolve:
    post:
      tags: [Group Sync]
      summary: 只读解析群二维码
      operationId: resolveGroupQRCode
      x-change-type: optimized
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QRCodeRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupQRCodeResolveResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/groups/qrcode/join:
    post:
      tags: [Group Sync]
      summary: 按二维码直接入群或提交审核申请
      operationId: joinGroupByQRCode
      x-change-type: new
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinGroupByQRCodeRequest'}
      responses:
        '200': {$ref: '#/components/responses/JoinGroupByQRCodeResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/groups/{id}/settings:
    put:
      tags: [Group Sync]
      summary: 更新群设置并同步 OpenIM
      operationId: updateGroupSettingsAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateGroupSettingsRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/groups/{id}/me/nickname:
    put:
      tags: [Group Sync]
      summary: 修改我在本群的昵称
      operationId: updateMyGroupNickname
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMyGroupNicknameRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/groups/{id}/remark:
    put:
      tags: [Group Sync]
      summary: 修改当前用户对群聊的备注
      operationId: updateMyGroupRemark
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRemarkRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/groups/{id}/members/{userId}/remark:
    put:
      tags: [Group Sync]
      summary: 修改当前用户对指定群成员的备注
      operationId: updateMyGroupMemberRemark
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRemarkRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/groups/{id}/reports:
    post:
      tags: [Group Sync]
      summary: 举报群聊
      operationId: reportGroup
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupReportRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupReportResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/groups/{id}/leave:
    post:
      tags: [Group Sync]
      summary: 退出群并同步 OpenIM
      description: 群主不能直接退出，应先转让群主或解散群。
      operationId: leaveGroupAndSyncOpenIM
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/groups/{id}/members/{userId}/role:
    put:
      tags: [Group Sync]
      summary: 设置或取消群管理员
      operationId: updateGroupMemberRole
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateGroupMemberRoleRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/groups/{id}/members/{userId}/mute:
    put:
      tags: [Group Sync]
      summary: 设置或解除群成员禁言
      operationId: updateGroupMemberMute
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateGroupMemberMuteRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/groups/{id}/mute:
    put:
      tags: [Group Sync]
      summary: 开启或关闭全员禁言
      operationId: updateGroupMute
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateGroupMuteRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/groups/{id}/dismiss:
    post:
      tags: [Group Sync]
      summary: 解散群并同步 OpenIM
      operationId: dismissGroup
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/OKResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/report-reasons:
    get:
      tags: [Reports]
      summary: 查询启用的用户举报原因
      operationId: listUserReportReasons
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - name: targetType
          in: query
          required: true
          schema: {type: string, enum: [user]}
        - name: language
          in: query
          schema: {type: string, maxLength: 8, default: zh}
      responses:
        '200': {$ref: '#/components/responses/ReportReasonsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/reports:
    post:
      tags: [Reports]
      summary: 提交用户举报
      operationId: createUserReport
      x-change-type: new
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserReportRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserReportResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/files/presign:
    post:
      tags: [Files]
      summary: 获取文件预签名上传地址
      operationId: presignFileUpload
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresignFileRequest'}
      responses:
        '200': {description: 预签名上传信息, content: {application/json: {schema: {$ref: '#/components/schemas/BaseEnvelope'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/files/uploads:
    post:
      tags: [Files]
      summary: 创建文件上传任务
      operationId: createFileUpload
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFileUploadRequest'}
      responses:
        '200': {description: 上传任务和预签名地址, content: {application/json: {schema: {$ref: '#/components/schemas/BaseEnvelope'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/files/uploads/complete:
    post:
      tags: [Files]
      summary: 确认文件上传完成
      operationId: completeFileUpload
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteFileUploadRequest'}
      responses:
        '200': {description: 已就绪文件信息, content: {application/json: {schema: {$ref: '#/components/schemas/BaseEnvelope'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/files:
    get:
      tags: [Files]
      summary: 查询当前用户上传的文件
      operationId: getFile
      security: [{bearerAuth: []}]
      parameters:
        - name: fileId
          in: query
          required: true
          schema: {$ref: '#/components/schemas/UUID'}
      responses:
        '200': {description: 文件信息, content: {application/json: {schema: {$ref: '#/components/schemas/BaseEnvelope'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/im/token:
    post:
      tags: [OpenIM Client]
      summary: 获取当前业务用户的 OpenIM Token 和连接地址
      description: |
        该接口在签发 Token 前会兜底确保用户已经存在于 OpenIM。
        相同业务用户和 platformId 在 Token 刷新时间到达前会返回同一份 Token，重复或并发调用不会反复踢掉 WebSocket 登录。
        客户端使用返回的 userId、token、wsAddr 初始化 OpenIM SDK；聊天 WebSocket 不连接 Go 后端。
      operationId: getOpenIMToken
      x-change-type: optimized
      security: [{bearerAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenIMTokenRequest'}
      responses:
        '200': {$ref: '#/components/responses/OpenIMTokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/v1/im/peers/{businessUserId}:
    get:
      tags: [OpenIM Client]
      summary: 解析单聊目标并校验聊天权限
      operationId: resolveOpenIMPeer
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessUserId'
      responses:
        '200': {$ref: '#/components/responses/OpenIMPeerResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/im/conversations/{peerType}/{peerId}:
    get:
      tags: [OpenIM Client]
      summary: 读取单聊或群聊的 OpenIM 全量会话设置
      operationId: getOpenIMConversationSettings
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PeerType'
        - $ref: '#/components/parameters/PeerId'
      responses:
        '200': {$ref: '#/components/responses/ConversationSettingsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [OpenIM Client]
      summary: 部分更新单聊或群聊的 OpenIM 会话设置
      description: 未传字段保持原值；请求体至少包含一个字段。
      operationId: updateOpenIMConversationSettings
      x-change-type: optimized
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PeerType'
        - $ref: '#/components/parameters/PeerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateConversationSettingsRequest'}
      responses:
        '200': {$ref: '#/components/responses/ConversationSettingsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/v1/im/conversations/{peerType}/{peerId}/read:
    post:
      tags: [OpenIM Client]
      summary: 标记单聊或群聊会话已读
      operationId: markOpenIMConversationRead
      x-change-type: new
      security: [{bearerAuth: []}]
      parameters:
