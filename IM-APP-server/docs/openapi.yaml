        - $ref: '#/components/parameters/ForwardTargetStatusQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/TargetLimitQuery'
      responses:
        '200': {$ref: '#/components/responses/ForwardTargetPageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

