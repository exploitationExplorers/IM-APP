      operationId: createFavorite
      x-change-type: optimized
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFavoriteRequest'}
      responses:
        '200': {$ref: '#/components/responses/FavoriteResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/favorites/list:
    post:
      tags: [Favorites]
      summary: 分页查询收藏列表
      description: 非 GET 接口统一使用 JSON body，不接受 query 参数。
      operationId: listFavorites
      x-change-type: optimized
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListFavoritesRequest'}
      responses:
        '200': {$ref: '#/components/responses/FavoritesResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

